server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    # 使用 127.0.0.1：避免 macOS 上 localhost 解析到 ::1 而 mysqld 只监听 127.0.0.1 导致连接失败
    url: jdbc:mysql://127.0.0.1:3306/campus_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: "CampusTradeJWTSecretKey2026_MinLength64_Chars______ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  expiration: 86400000

trade:
  upload-dir: ./upload

logging:
  level:
    com.campus.trade: INFO
